<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Naol Health Doctor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--g:rgba(10,20,32,.78);--b:rgba(255,255,255,.13);--t:#eaf6f6;--a:#19e6c1;--r:#ff4d6d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Ethiopic",sans-serif;color:var(--t);background:radial-gradient(ellipse at 50% 35%,#16424d 0%,#0a1b2b 55%,#050b14 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--g);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
/* top bar */
#top{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:6;display:flex;align-items:center;gap:12px;padding:8px 12px;animation:drop .8s ease both}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),#2b8cff);display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;animation:beat 1.3s infinite}
.brand b{font-size:18px;background:linear-gradient(90deg,#fff,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.7}
#tabs{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none;justify-content:center}
#tabs button,#langs button{background:rgba(255,255,255,.07);border:1px solid var(--b);color:var(--t);padding:8px 12px;border-radius:11px;font-size:14px;cursor:pointer;white-space:nowrap;transition:.2s}
#tabs button.on,#langs button.on{background:var(--a);border-color:var(--a);color:#032;font-weight:700}
#langs{display:flex;gap:4px;flex-shrink:0}#langs button{padding:8px 10px;font-size:13px}
/* panel */
#panel{position:absolute;right:10px;top:calc(max(10px,env(safe-area-inset-top)) + 64px);bottom:12px;width:330px;z-index:5;overflow:auto;padding:14px;animation:slide .9s ease both}
#panel h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--a);margin:16px 0 8px}#panel h3:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--b);color:var(--t);padding:7px 11px;border-radius:10px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.18)}.chip.on{background:var(--a);border-color:var(--a);color:#032;font-weight:600}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0}
.sw input[type=checkbox]{accent-color:var(--a);width:18px;height:18px}
.sl{font-size:13px;margin-top:8px;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--a)}
#search{width:100%;margin-bottom:8px;background:rgba(255,255,255,.08);border:1px solid var(--b);border-radius:10px;padding:10px;color:var(--t);font-size:14px;outline:none}
#plist .grp{font-size:11px;opacity:.6;margin:10px 0 4px;text-transform:uppercase}
#plist button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;background:rgba(255,255,255,.05);border:1px solid transparent;color:var(--t);padding:9px 10px;border-radius:9px;font-size:14px;cursor:pointer;margin-bottom:3px}
#plist button:hover,#plist button.on{border-color:var(--a);background:rgba(25,230,193,.15)}
#plist i{width:11px;height:11px;border-radius:4px;flex-shrink:0}
/* info card */
#info{position:absolute;left:10px;bottom:12px;width:350px;max-height:46%;overflow:auto;z-index:4;padding:16px;display:none}
#info.show{display:block;animation:rise .4s ease both}
#info .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--t);font-size:18px;cursor:pointer}
#info .ih{display:flex;align-items:center;gap:9px;font-size:20px}#info .ih i{width:14px;height:14px;border-radius:5px}
#info .on{font-size:12px;opacity:.7;margin:3px 0 8px}
#info p{font-size:14.5px;line-height:1.55}
#info .al{margin-top:8px;font-size:13px;opacity:.85;line-height:1.5;border-top:1px solid var(--b);padding-top:8px}
#info .al b{color:var(--a)}
#tip{position:fixed;z-index:9;pointer-events:none;background:rgba(0,0,0,.8);color:#fff;font-size:13px;padding:5px 10px;border-radius:8px;display:none}
#zb{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}
#zb button{width:44px;height:44px;border-radius:12px;font-size:20px;color:var(--t);cursor:pointer;border:1px solid var(--b)}
#quiz{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 64px);z-index:6;padding:12px 18px;font-size:16px;display:none;text-align:center;max-width:92%}
#quiz.show{display:block;animation:drop .4s ease both}#quiz b{color:var(--a)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:8;padding:14px 22px;font-size:18px;opacity:0;pointer-events:none;transition:.35s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#tog{display:none;position:absolute;right:10px;bottom:12px;z-index:7;padding:12px 16px;font-size:18px;color:#fff;cursor:pointer;border:1px solid var(--b)}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}@keyframes slide{from{opacity:0;transform:translateX(40px)}}@keyframes rise{from{opacity:0;transform:translateY(20px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
@media(max-width:900px){
 #top{flex-wrap:wrap;gap:6px;padding:8px}.brand{flex:1}#tabs{order:3;flex-basis:100%;justify-content:flex-start}
 #panel{top:auto;left:10px;right:10px;width:auto;max-height:58%;bottom:0;border-radius:18px 18px 0 0;transform:translateY(110%);transition:transform .4s;animation:none}
 #panel.open{transform:none}
 #tog{display:block}#info{left:10px;right:10px;width:auto;bottom:70px;max-height:36%}
 #zb{top:auto;bottom:70px;transform:none;flex-direction:row;left:auto;right:10px}#zb button{width:40px;height:40px}
 #quiz{top:calc(max(10px,env(safe-area-inset-top)) + 112px);font-size:14px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="glass">
 <div class="brand"><div class="logo">✚</div><div><b>Naol Health Doctor</b><small data-i="sub"></small></div></div>
 <div id="tabs"></div>
 <div id="langs"><button data-l="0">OM</button><button data-l="1">አማ</button><button data-l="2">EN</button></div>
</div>
<div id="zb">
 <button class="glass" id="zin">＋</button><button class="glass" id="zout">－</button>
 <button class="glass" id="home">⟲</button><button class="glass" id="fs">⛶</button>
</div>
<div id="quiz" class="glass"></div>
<div id="toast" class="glass"></div>
<div id="tip"></div>
<div id="info" class="glass"></div>
<button id="tog" class="glass">☰</button>

<div id="panel" class="glass">
 <h3 data-i="layers"></h3>
 <div class="row" id="presets"></div>
 <div class="row" id="layers" style="margin-top:8px"></div>

 <h3 data-i="view"></h3>
 <div class="sl"><span data-i="skinop"></span><span id="sov">25</span></div><input type="range" id="skinop" min="0" max="100" value="25">
 <div class="sl"><span data-i="explode"></span></div><input type="range" id="ex" min="0" max="100" value="0">
 <div class="sl"><span data-i="cut"></span></div><input type="range" id="cut" min="0" max="100" value="0">
 <label class="sw"><span data-i="xray"></span><input type="checkbox" id="xray"></label>
 <label class="sw"><span data-i="iso"></span><input type="checkbox" id="iso"></label>

 <h3 data-i="anim"></h3>
 <label class="sw"><span data-i="heart"></span><input type="checkbox" id="beat" checked></label>
 <label class="sw"><span data-i="breath"></span><input type="checkbox" id="breath" checked></label>
 <label class="sw"><span data-i="flow"></span><input type="checkbox" id="flow"></label>
 <label class="sw"><span data-i="rot"></span><input type="checkbox" id="rot"></label>
 <div class="row" style="margin-top:8px"><button class="chip" id="quizbtn">🎯 <span data-i="quiz"></span></button></div>

 <h3 data-i="parts"></h3>
 <input id="search" autocomplete="off">
 <div id="plist"></div>
</div>

<script>
const T=THREE,$=s=>document.querySelector(s);
/* =====================================================
   KUTAA 1: DAATAA (maqaa fi ibsa — Oromo | አማርኛ | English)
   ===================================================== */
const p=(a,b,c,d,e,f)=>[[a,b,c],[d,e,f]];
const D={
human:{
skin:p(`Gogaa`,`ቆዳ`,`Skin`,`Gogaan qaama keenya hunda uwwisa; qaama ittisa, hoo'a to'ata, tuqaa fi dhukkubbii dhaga'a.`,`ቆዳ መላውን አካል ይሸፍናል፤ ከበሽታ ይከላከላል፣ ሙቀትን ይቆጣጠራል፣ ንክኪና ህመም ይሰማል።`,`Skin covers the whole body; it protects, regulates temperature and senses touch and pain.`),
skull:p(`Lafee mataa`,`የራስ ቅል`,`Skull`,`Lafee mataa sammuu eega; lafee 22 qaba.`,`የራስ ቅል አንጎልን ይጠብቃል፤ 22 አጥንቶች አሉት።`,`The skull protects the brain; it is made of 22 bones.`),
spine:p(`Lafee dugdaa`,`አከርካሪ`,`Spine`,`Lafee dugdaa (vertebrae) 33 qaba; qaama dhaabbachiisa, sararoota narvii eega.`,`አከርካሪ 33 አጥንቶች አሉት፤ አካልን ደግፎ የአከርካሪ ነርቭን ይጠብቃል።`,`The spine has 33 vertebrae; it supports the body and protects the spinal cord.`),
ribs:p(`Lafee cinaa (Ribs)`,`የጎድን አጥንት`,`Rib cage`,`Lafee cinaa 12 bocoo bocoo; onnee fi sombaa eega.`,`12 ጥንድ የጎድን አጥንቶች ልብና ሳንባን ይጠብቃሉ።`,`12 pairs of ribs protect the heart and lungs.`),
pelvis:p(`Lafee mudhii (Pelvis)`,`ዳሌ`,`Pelvis`,`Lafee mudhii ulfaatina qaamaa baata; miila fi qaama gubbaa wal hidha.`,`ዳሌ የሰውነትን ክብደት ይሸከማል፤ እግሮችን ከግንድ አካል ያገናኛል።`,`The pelvis bears body weight and connects the legs to the trunk.`),
armbones:p(`Lafee harkaa`,`የእጅ አጥንቶች`,`Arm bones`,`Humerus, radius fi ulna: harka sochoosuu fi qabachuuf nu gargaaru.`,`ሂውመረስ፣ ራዲየስና ኡልና እጅን ለእንቅስቃሴና ለመያዝ ይረዳሉ።`,`Humerus, radius and ulna let the arm move and grasp.`),
legbones:p(`Lafee miilaa`,`የእግር አጥንቶች`,`Leg bones`,`Femur lafee qaama keessaa isa dheeraa fi cimaadha; tibia fi fibula jilba jalaa jiru.`,`ፌመር (የጭን አጥንት) በሰውነት ውስጥ ረጅሙና ጠንካራው አጥንት ነው።`,`The femur is the longest, strongest bone in the body.`),
pect:p(`Foon laphee (Pectoral)`,`የደረት ጡንቻ`,`Pectoral muscles`,`Harka fuullee fi gara qaamaatti harkisuuf gargaara.`,`ክንድን ወደ ፊትና ወደ ሰውነት ለመሳብ ይረዳል።`,`Pulls the arm forward and toward the body.`),
delt:p(`Foon gateettii (Deltoid)`,`የትከሻ ጡንቻ`,`Deltoid`,`Harka ol kaasuuf gargaara; gateettii bifa kenna.`,`ክንድን ለማንሳት ይረዳል፤ ለትከሻ ቅርጽ ይሰጣል።`,`Raises the arm and shapes the shoulder.`),
armM:p(`Foon harkaa`,`የክንድ ጡንቻ`,`Arm muscles`,`Biceps harka muruu, triceps immoo diriirsuuf hojjata.`,`ባይሴፕስ ክንድን ያጥፋል፣ ትራይሴፕስ ያቃናል።`,`Biceps bends the elbow; triceps straightens it.`),
abs:p(`Foon garaa`,`የሆድ ጡንቻ`,`Abdominal muscles`,`Qaama dugdaa deeggara; hafuuraa fi ol kaasuu irratti gargaara.`,`አካልን ይደግፋል፤ በመተንፈስና በማንሳት ይረዳል።`,`Supports the trunk and helps with breathing and lifting.`),
back:p(`Foon dugdaa`,`የጀርባ ጡንቻ`,`Back muscles`,`Trapezius fi latissimus dugda dhaabbachiisu, harka duubatti harkisu.`,`ትራፔዚየስና ላቲሲመስ አከርካሪን ያቆማሉ፣ ክንድን ወደ ኋላ ይስባሉ።`,`Trapezius and latissimus hold the spine upright and pull the arm back.`),
glute:p(`Foon mudhii duubaa (Gluteus)`,`የሰገላ ጡንቻ`,`Gluteal muscles`,`Foon qaama keessaa isa guddaa; dhaabachuu fi adeemuuf barbaachisaadha.`,`በሰውነት ትልቁ ጡንቻ ነው፤ ለመቆምና ለመራመድ ወሳኝ ነው።`,`The body's largest muscle group; key for standing and walking.`),
quads:p(`Foon ciisaa`,`የጭን ጡንቻ`,`Thigh muscles`,`Quadriceps jilba diriirsa; hamstring jilba muda.`,`ኳድሪሴፕስ ጉልበትን ያቃናል፣ ሃምስትሪንግ ያጥፋል።`,`Quadriceps straightens the knee; hamstrings bend it.`),
calves:p(`Foon kuusaa miilaa`,`የታችኛው እግር ጡንቻ`,`Calf muscles`,`Kottoonfachuu, fiiguu fi utaaluuf gargaara.`,`ተረከዝን ለማንሳት፣ ለመሮጥና ለመዝለል ይረዳል።`,`Lifts the heel; essential for walking, running and jumping.`),
brain:p(`Sammuu`,`አንጎል`,`Brain`,`Sammuun yaada, yaadannoo fi qaama hunda to'ata; neuroonii biliyoona 86 ta'a qaba.`,`አንጎል አስተሳሰብን፣ ትውስታንና መላ አካልን ይቆጣጠራል፤ 86 ቢሊዮን ያህል ነርቮች አሉት።`,`The brain controls thought, memory and the whole body; about 86 billion neurons.`),
heart:p(`Onnee`,`ልብ`,`Heart`,`Onnee dhiiga qaama hundatti dhiibaa; daqiiqaatti altokko 60–100 rukuta.`,`ልብ ደምን ወደ መላ አካል ይረጫል፤ በደቂቃ ከ60 እስከ 100 ጊዜ ይመታል።`,`The heart pumps blood to the whole body, beating 60–100 times a minute.`),
lungs:p(`Sombaa`,`ሳንባ`,`Lungs`,`Sombaan ikkisjiinii dhiigatti galchee kaarboon daayoksaayidii baasa.`,`ሳንባ ኦክስጅንን ወደ ደም ያስገባል፣ ካርቦን ዳይኦክሳይድንም ያስወጣል።`,`The lungs take oxygen into the blood and remove carbon dioxide.`),
trachea:p(`Ujummoo hafuuraa`,`የመተንፈሻ ቧንቧ`,`Trachea (windpipe)`,`Qilleensa afaan fi funyaan irraa gara sombaatti geessa.`,`አየርን ከአፍና አፍንጫ ወደ ሳንባ ያደርሳል።`,`Carries air from the mouth and nose to the lungs.`),
liver:p(`Tiruu (Liver)`,`ጉበት`,`Liver`,`Tiruun summii qaama keessaa baasa, bile hojjata, soorata kuusa.`,`ጉበት መርዝን ያጣራል፣ ሐሞትን ያመርታል፣ ንጥረ ነገሮችን ያከማቻል።`,`The liver filters toxins, makes bile and stores nutrients.`),
stomach:p(`Garaa (Stomach)`,`ጨጓራ`,`Stomach`,`Garaan nyaata asiidii fi sochii foonii dhaan caccabsa.`,`ጨጓራ ምግብን በአሲድና በጡንቻ እንቅስቃሴ ይፈጫል።`,`The stomach breaks food down with acid and muscle contractions.`),
kidneys:p(`Kalee`,`ኩላሊት`,`Kidneys`,`Kaleen dhiiga qulqulleessa, fincaan hojjata.`,`ኩላሊት ደምን ያጣራል፣ ሽንትንም ያመርታል።`,`The kidneys filter blood and make urine.`),
smallInt:p(`Handhuura xiqqaa`,`ትንሹ አንጀት`,`Small intestine`,`Meetira 6 ol dheeraa; nyaata keessaa soorata fudhata.`,`ከ6 ሜትር በላይ ርዝመት አለው፤ ከምግብ ንጥረ ነገሮችን ይወስዳል።`,`Over 6 m long; absorbs most nutrients from food.`),
largeInt:p(`Handhuura guddaa`,`ትልቁ አንጀት`,`Large intestine`,`Bishaan fudhatee kosii (stool) uuma.`,`ውሃን ይወስዳል፣ ቆሻሻን (ሰገራ) ይፈጥራል።`,`Absorbs water and forms stool.`),

/* =====================================================
   KUTAA 5: Model ijaaruu, ibsaa, fi to'annoo
   ===================================================== */
let lang=0;try{lang=+(localStorage.getItem('nhd_l')||0)}catch(e){}
let sel=null,iso=false,xray=false,skinOp=.25,beatOn=true,breathOn=true,flowOn=false,quiz=null,score=[0,0],allL=false,tw=null,ex=0,zr=[-1,1];
const lay={};
function build(name){
 while(G.children.length){const o=G.children.pop();o.geometry&&o.geometry.dispose();o.material&&o.material.dispose()}
 cur={name,parts:{},all:[],fa:[],fv:[]};sel=null;quiz=null;
 G.scale.set(1,1,1);G.position.set(0,0,0);B[name]();
 const box=new T.Box3().setFromObject(G),sz=box.getSize(new T.Vector3()),s=(name==='human'?17:15)/Math.max(sz.x,sz.y,sz.z);
 G.scale.setScalar(s);G.updateMatrixWorld(true);const b2=new T.Box3().setFromObject(G),c=b2.getCenter(new T.Vector3());
 G.position.set(-c.x,-b2.min.y,-c.z);G.updateMatrixWorld(true);
 const wb=new T.Box3().setFromObject(G),ws=wb.getSize(new T.Vector3());zr=[wb.min.z,wb.max.z];
 const gc=new T.Vector3();cur.all.forEach(m=>{m.geometry.computeBoundingBox();m.updateMatrix();m.userData.ctr=m.geometry.boundingBox.getCenter(new T.Vector3()).applyMatrix4(m.matrix);gc.add(m.userData.ctr)});
 cur.gc=gc.divideScalar(cur.all.length);
 /* hidda dhiigaa yaa'uu */
 cur.fp=[[cur.fa,0xff3b3b],[cur.fv,0x3b7bff]].map(([cs,col])=>{const n=cs.length*14,g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(n*3),3));
  const pt=new T.Points(g,new T.PointsMaterial({size:.3,color:col,transparent:true,opacity:.95,depthWrite:false}));pt.frustumCulled=false;G.add(pt);return{pt,cs,n}});
 const fr_=Math.max(ws.x,ws.z)*.62;floor.scale.setScalar(fr_);floor.position.y=.02;
 const h=ws.y,d=Math.max(h*1.7,ws.z*1.9,ws.x*1.9),home=name==='human'?{t:new T.Vector3(0,h*.5,0),p:new T.Vector3(0,h*.55,d)}:{t:new T.Vector3(0,h*.5,0),p:new T.Vector3(d*.7,h*.8,d*.75)};

function applyVis(){
 cur.all.forEach(m=>{const u=m.userData,mt=m.material;m.visible=!!lay[u.sys];
  let o=u.sys==='skin'?skinOp:(xray?.4:1);if(sel&&iso&&u.id!==sel)o=Math.min(o,.08);
  mt.opacity=o;mt.transparent=o<.99;mt.depthWrite=o>.6;
  const on=u.id===sel;mt.emissive.setHex(on?0x138a76:0);mt.emissiveIntensity=on?.9:0});
 const fv=flowOn&&lay.vessel&&ex<.03;cur.fp.forEach(f=>f.pt.visible=!!fv);
 $('#layers').querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',!!lay[b.dataset.k]));
}
function explode(){cur.all.forEach(m=>{const u=m.userData;m.position.copy(u.base).addScaledVector(u.ctr.clone().sub(cur.gc),ex*.75)});applyVis()}
function setPreset(k){const on={all:SYS,mus:['muscle'],ske:['bone'],org:['organ','vessel','nerve']}[k];SYS.forEach(s=>lay[s]=on.includes(s)?1:0);applyVis()}

/* =====================================================
   KUTAA 6: UI — tabs, tarree qaamolee, ibsa (info)
   ===================================================== */
const U=k=>UI[k][lang];
function renderAll(){
 document.documentElement.lang=['om','am','en'][lang];
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=U(e.dataset.i));
 $('#search').placeholder=U('search');
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===lang));
 $('#tabs').innerHTML='';Object.entries(MODELS).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v[0]+' '+v[1+lang];b.className=cur.name===k?'on':'';b.onclick=()=>build(k);$('#tabs').appendChild(b)});
 $('#presets').innerHTML='';[['all','pAll'],['mus','pMus'],['ske','pSke'],['org','pOrg']].forEach(([k,l])=>{const b=document.createElement('button');b.className='chip';b.textContent=U(l);b.onclick=()=>setPreset(k);$('#presets').appendChild(b)});
 $('#layers').innerHTML='';SYS.filter(s=>cur.all.some(m=>m.userData.sys===s)).forEach(s=>{const b=document.createElement('button');b.className='chip';b.dataset.k=s;b.innerHTML=`<i style="background:#${COL[s].toString(16).padStart(6,'0')}"></i>${LY[s][lang]}`;b.onclick=()=>{lay[s]=lay[s]?0:1;applyVis()};$('#layers').appendChild(b)});
 renderList();showInfo();showQuiz();
}
const hex=id=>'#'+cur.parts[id].ms[0].material.color.getHexString();
function renderList(){
 const q=$('#search').value.trim().toLowerCase(),L=$('#plist');L.innerHTML='';
 SYS.forEach(s=>{const ids=Object.keys(cur.parts).filter(id=>cur.parts[id].sys===s&&(!q||D[cur.name][id][0].some(n=>n.toLowerCase().includes(q))));if(!ids.length)return;
  const g=document.createElement('div');g.className='grp';g.textContent=LY[s][lang];L.appendChild(g);
  ids.forEach(id=>{const b=document.createElement('button');if(id===sel)b.className='on';b.innerHTML=`<i style="background:${hex(id)}"></i>${D[cur.name][id][0][lang]}`;b.onclick=()=>{pick(id);if(innerWidth<=900)$('#panel').classList.remove('open')};L.appendChild(b)})});
}
function showInfo(){
 const el=$('#info');if(!sel||quiz){el.classList.remove('show');return}
 const d=D[cur.name][sel],o=[0,1,2].filter(i=>i!==lang).map(i=>d[0][i]).join(' • ');
 el.innerHTML=`<button class="x" id="ix">✕</button><div class="ih"><i style="background:${hex(sel)}"></i><b>${d[0][lang]}</b></div><div class="on">${o}</div><p>${d[1][lang]}</p>
 <button class="chip" id="al" style="margin-top:10px">${U('all')}</button>${allL?`<div class="al">${['OM','አማ','EN'].map((l,i)=>`<div><b>${l}:</b> ${d[0][i]} — ${d[1][i]}</div>`).join('')}</div>`:''}`;
 el.classList.add('show');$('#ix').onclick=()=>select(null);$('#al').onclick=()=>{allL=!allL;showInfo()};
}
function toast(h,ms=1300){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),ms)}

/* =====================================================
   KUTAA 7: Filachuu, kaameraa, qormaata (quiz)
   ===================================================== */
function partBox(id){const b=new T.Box3();cur.parts[id].ms.forEach(m=>b.expandByObject(m));return b}
function select(id,fly=true){
 sel=id;applyVis();renderList();showInfo();
 if(id&&fly){G.updateMatrixWorld(true);const b=partBox(id),c=b.getCenter(new T.Vector3()),sz=b.getSize(new T.Vector3()).length(),dir=camera.position.clone().sub(controls.target).normalize();
  tw={t:c,p:c.clone().add(dir.multiplyScalar(Math.max(4.5,sz*1.7)))}}
}
function pick(id){if(quiz)return answer(id);select(id)}
function showQuiz(){const q=$('#quiz');if(!quiz){q.classList.remove('show');return}
 q.innerHTML=`🎯 ${U('where')} <b>${D[cur.name][quiz.id][0][lang]}</b> ?  <small>(${score[0]}/${score[1]})</small>`;q.classList.add('show')}
function nextQ(){const ids=Object.keys(cur.parts).filter(id=>cur.parts[id].sys!=='skin'&&lay[cur.parts[id].sys]);if(!ids.length)return;quiz={id:ids[Math.random()*ids.length|0]};select(null);showQuiz()}
function answer(id){score[1]++;if(id===quiz.id){score[0]++;toast(U('ok'))}else toast(`${U('no')}: <b>${D[cur.name][id][0][lang]}</b>`,1600);
 const right=quiz.id;sel=right;applyVis();setTimeout(()=>{sel=null;nextQ()},1400)}
$('#quizbtn').onclick=()=>{if(quiz){quiz=null;score=[0,0];showQuiz();select(null)}else nextQ()};

/* kaameraa */
function dolly(f){const v=camera.position.clone().sub(controls.target).multiplyScalar(f);tw={t:controls.target.clone(),p:controls.target.clone().add(v)}}
$('#zin').onclick=()=>dolly(.7);$('#zout').onclick=()=>dolly(1.35);$('#home').onclick=()=>{tw={t:cur.home.t.clone(),p:cur.home.p.clone()}};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
$('#tog').onclick=()=>$('#panel').classList.toggle('open');
cv.addEventListener('pointerdown',()=>{tw=null});
cv.addEventListener('wheel',()=>{tw=null},{passive:true});

/* kontrolaalee */
$('#skinop').oninput=e=>{skinOp=e.target.value/100;$('#sov').textContent=e.target.value;applyVis()};
$('#ex').oninput=e=>{ex=e.target.value/100;explode()};

$('#xray').onchange=e=>{xray=e.target.checked;applyVis()};$('#iso').onchange=e=>{iso=e.target.checked;applyVis()};
$('#beat').onchange=e=>beatOn=e.target.checked;$('#breath').onchange=e=>breathOn=e.target.checked;
$('#flow').onchange=e=>{flowOn=e.target.checked;applyVis()};$('#rot').onchange=e=>controls.autoRotate=e.target.checked;
$('#search').oninput=renderList;
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{lang=+b.dataset.l;try{localStorage.setItem('nhd_l',lang)}catch(e){}renderAll()});

/* tuqaa (click) fi hover */
const ray=new T.Raycaster(),mv=new T.Vector2();let dn=null,lastHov=0;
function hit(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
 const hs=ray.intersectObjects(cur.all.filter(m=>m.visible&&m.material.opacity>.12),false);return(hs.find(h=>h.object.userData.sys!=='skin')||hs[0])?.object.userData.id}
cv.addEventListener('pointerdown',e=>dn={x:e.clientX,y:e.clientY,t:Date.now()});
cv.addEventListener('pointerup',e=>{if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<6&&Date.now()-dn.t<500){const id=hit(e);id?pick(id):(!quiz&&select(null))}dn=null});
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons||Date.now()-lastHov<70)return;lastHov=Date.now();
 const id=hit(e),t=$('#tip');if(id&&!quiz){t.textContent=D[cur.name][id][0][lang];t.style.display='block';t.style.left=e.clientX+14+'px';t.style.top=e.clientY+14+'px';cv.style.cursor='pointer'}else{t.style.display='none';cv.style.cursor=''}});

/* =====================================================
   KUTAA 8: Animeeshiinii (loop)
   ===================================================== */
const tv=new T.Vector3();
function loop(ms){
 requestAnimationFrame(loop);const s=ms/1000;
 if(tw){controls.target.lerp(tw.t,.08);camera.position.lerp(tw.p,.08);if(camera.position.distanceTo(tw.p)<.05)tw=null}
 controls.update();
 const hp=cur.parts.heart,lp=cur.parts.lungs;
 if(hp){const k=beatOn?1+.12*Math.pow(Math.max(0,Math.sin(s*5.5)),8)+.05*Math.pow(Math.max(0,Math.sin(s*5.5-1)),8):1;hp.ms.forEach(m=>m.scale.copy(m.userData.s0).multiplyScalar(k))}
 if(lp){const b=breathOn?(Math.sin(s*1.5)*.5+.5):0;lp.ms.forEach(m=>m.scale.set(m.userData.s0.x*(1+.06*b),m.userData.s0.y*(1+.05*b),m.userData.s0.z*(1+.07*b)))}
 if(flowOn)cur.fp.forEach((f,fi)=>{if(!f.pt.visible)return;const a=f.pt.geometry.attributes.position;let j=0;
  f.cs.forEach(c=>{for(let i=0;i<14;i++){let u=(s*.1+i/14)%1;if(fi)u=1-u;c.getPoint(u,tv);a.setXYZ(j++,tv.x,tv.y,tv.z)}});a.needsUpdate=true});
 fr.material.opacity=.55+.3*Math.sin(s*2);fr2.scale.setScalar(1+.04*Math.sin(s*2));
 renderer.render(scene,camera);
}
build('human');requestAnimationFrame(loop);
